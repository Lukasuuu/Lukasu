<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0f172a"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#grad1)"/>
  <circle cx="100" cy="100" r="200" fill="#f59e0b" opacity="0.1"/>
  <circle cx="700" cy="500" r="150" fill="#d97706" opacity="0.1"/>

  <g transform="translate(350, 180)">
    <rect x="0" y="20" width="100" height="80" rx="10" fill="none" stroke="url(#grad2)" stroke-width="4"/>
    <line x1="0" y1="45" x2="100" y2="45" stroke="url(#grad2)" stroke-width="4"/>
    <line x1="25" y1="0" x2="25" y2="20" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="0" x2="75" y2="20" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 30 70 L 45 85 L 75 55" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Badge -->
  <rect x="320" y="130" width="160" height="30" rx="15" fill="#22c55e"/>
  <text x="400" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ECONOMIZE 17%</text>

  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">BookMe</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">Plano Pro Anual</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#grad2)">€290</text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">por ano</text>

  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Agendamentos ilimitados • Notificações • Dashboard • Suporte Priority</text>
